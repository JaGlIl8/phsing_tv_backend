name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # 升級到 v4 以支援最新的 Node.js 環境
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        # 將 PHP 版本提升到 8.4，以滿足 Symfony 8.0 套件的需求
        php-version: '8.4'
        extensions: mbstring, dom, curl, libxml, mysql, sqlite
        coverage: xdebug

    - name: Install Dependencies
      # 如果你的 composer.lock 是在不同版本下產生的，加上 --ignore-platform-reqs 可以減少版本衝突
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # 確保建立一個空的 sqlite 資料庫檔案供測試使用 (如果你的 phpunit.xml 用 sqlite 的話)
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      run: vendor/bin/phpunit
