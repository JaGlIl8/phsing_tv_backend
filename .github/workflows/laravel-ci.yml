name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 讓你可以在 GitHub 介面手動點擊執行

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    # 升級到 v4 以支援最新的 Node 環境
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        # 重點：改為 8.4 以滿足 symfony 8.0 套件的要求
        php-version: '8.4'
        extensions: mbstring, dom, curl, libxml, mysql, sqlite
        coverage: xdebug

    - name: Install Dependencies
      # 加上 --ignore-platform-reqs 可以預防極少數環境偵測誤判
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests
      # 執行測試（包含你的 Pest 或 PHPUnit）
      run: php artisan test
